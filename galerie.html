<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToSch | Galerie</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* CSS RESET & VARIABLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0c0c0c;
            --card-bg: #161616;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent-gold: #c5a059;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Inter', sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.8;
        }

        /* NAVIGATION */
        .top-nav {
            width: 100%;
            background-color: #050505;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 0;
            text-align: center;
        }

        .top-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: inline-flex;
            gap: 35px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .top-nav a:hover,
        .top-nav a.active {
            color: var(--accent-gold); /* Aktiver Menüpunkt leuchtet gold */
        }

        /* BANNER */
        .top-banner {
            width: 100%;
            background-color: #000000;
            margin: 0;
            padding: 0;
        }

        .top-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* GALLERIE TITEL & GRID */
        .page-title {
            text-align: center;
            padding: 50px 20px 10px;
            font-family: var(--font-heading);
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .gallery-container {
            max-width: 1300px;
            margin: 30px auto 80px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
        }

        .art-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .art-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .img-wrapper {
            width: 100%;
            height: 360px;
            overflow: hidden;
            background-color: #050505;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .art-card:hover .img-wrapper img {
            transform: scale(1.04);
        }

        .art-info {
            padding: 20px;
            text-align: center;
        }

        .art-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .art-details {
            font-size: 0.85rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.85rem;
            border-top: 1px solid #1a1a1a;
        }

        /* LIGHTBOX MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            color: var(--text-main);
            font-size: 35px;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Startseite</a></li>
            <li><a href="galerie.html">Galerie</a></li>
            <li><a href="ausstellungen.html">Veröffentlichungen & Ausstellungen</a></li>
            <li><a href="nutzungsrechte.html">Erwerb der Nutzungsrechte</a></li>
            <li><a href="index.html#about">Über ToSch</a></li>
            <li><a href="index.html#kontakt">Kontakt</a></li>
        </ul>
    </nav>

    <!-- BANNER -->
    <div class="top-banner">
        <img src="banner-tosch1.png" alt="ToSch Art Banner">
    </div>

    <!-- SEITENTITEL -->
    <h1 class="page-title">Kunstwerke & Unikate</h1>

    <!-- GALERIE GRID -->
    <main class="gallery-container">
        
        <!-- Bild-Karte 1 -->
        <div class="art-card" onclick="openModal('Halsband_Ameisenvogel_geschuetzt.jpg')">
            <div class="img-wrapper">
                <img src="Halsband_Ameisenvogel_geschuetzt.jpg" alt="Unikat 1">
            </div>
            <div class="art-info">
                <h3 class="art-title">Unikat I</h3>
                <p class="art-details">Halsband-Ameisenvogel</p>
            </div>
        </div>

        <!-- Bild-Karte 2 -->
        <div class="art-card" onclick="openModal('images/bild2.jpg')">
            <div class="img-wrapper">
                <img src="images/bild2.jpg" alt="Unikat 2">
            </div>
            <div class="art-info">
                <h3 class="art-title">Unikat II</h3>
                <p class="art-details">Zeitgenössische Kunst</p>
            </div>
        </div>

        <!-- Bild-Karte 3 -->
        <div class="art-card" onclick="openModal('images/bild3.jpg')">
            <div class="img-wrapper">
                <img src="images/bild3.jpg" alt="Unikat 3">
            </div>
            <div class="art-info">
                <h3 class="art-title">Unikat III</h3>
                <p class="art-details">Zeitgenössische Kunst</p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; ToSch . Alle Rechte vorbehalten.</p>
    </footer>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img id="modal-img" src="" alt="Großansicht Kunstwerk">
    </div>

    <!-- JAVASCRIPT -->
    <script>
        function openModal(imageSrc) {
            document.getElementById('modal-img').src = imageSrc;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
